<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜今井雄馬</title>
<meta name="description" content="採用代行(RPO)に関するご相談・お問い合わせはこちらから。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles.css">
<style>
  .form-field { margin-bottom: 22px; }
  .form-field label { display: block; font-size: var(--fs-small); margin-bottom: 8px; color: var(--c-ink-soft); }
  .form-field label .req { color: var(--c-accent-deep); margin-left: 4px; }
  .form-field input,
  .form-field select,
  .form-field textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    background: #fff;
    font-family: var(--f-body);
    font-size: var(--fs-body);
    color: var(--c-ink);
  }
  .form-field textarea { min-height: 140px; resize: vertical; }
  .form-check { display: flex; align-items: flex-start; gap: 8px; font-size: var(--fs-small); color: var(--c-ink-soft); }
  .form-submit {
    background: var(--c-accent);
    color: #fff;
    border: none;
    padding: 14px 34px;
    border-radius: var(--radius);
    font-size: var(--fs-body);
    font-family: var(--f-body);
    cursor: pointer;
  }
  .form-submit:hover { background: var(--c-accent-deep); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="../../index.html" class="logo">今井雄馬<span>。</span></a>
    <nav class="nav-links">
      <a href="../../index.html#service">サービス</a>
      <a href="../../index.html#area">対応エリア</a>
      <a href="../../index.html#profile">代表について</a>
    </nav>
    <a href="#form" class="btn-cta">無料相談を申し込む</a>
  </div>
</header>

<div class="article-header">
  <div class="wrap">
    <span class="kicker">お問い合わせ</span>
    <h1>まずは、採用のお悩みをお聞かせください</h1>
    <p style="color:var(--c-ink-soft); margin-top:12px;">「何から手をつければいいか分からない」という段階でも歓迎です。ご相談は無料です。オンラインでのご相談も可能です。</p>
  </div>
</div>

<div class="wrap">
  <div class="article-body" id="form">
    <form action="https://formsubmit.co/inforecruit58720@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【今井雄馬】お問い合わせフォームより">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">

      <div class="form-field">
        <label>お問い合わせ種別<span class="req">必須</span></label>
        <select name="お問い合わせ種別" required>
          <option value="">選択してください</option>
          <option>まずは無料相談したい</option>
          <option>料金について知りたい</option>
          <option>サービス内容について詳しく知りたい</option>
          <option>応募が集まらず困っている</option>
          <option>採用業務を代行してほしい</option>
          <option>採用戦略・求人票を見直したい</option>
          <option>採用担当者がいない／人手が足りない</option>
          <option>その他</option>
        </select>
      </div>

      <div class="form-field">
        <label>貴社名<span class="req">必須</span></label>
        <input type="text" name="貴社名" required>
      </div>

      <div class="form-field">
        <label>ご担当者様名<span class="req">必須</span></label>
        <input type="text" name="ご担当者様名" required>
      </div>

      <div class="form-field">
        <label>役職</label>
        <input type="text" name="役職">
      </div>

      <div class="form-field">
        <label>メールアドレス<span class="req">必須</span></label>
        <input type="email" name="メールアドレス" required>
      </div>

      <div class="form-field">
        <label>電話番号</label>
        <input type="tel" name="電話番号">
      </div>

      <div class="form-field">
        <label>今井雄馬を知ったきっかけ</label>
        <select name="きっかけ">
          <option value="">選択してください</option>
          <option>検索エンジン</option>
          <option>SNS</option>
          <option>知人・取引先からの紹介</option>
          <option>記事・メディア掲載</option>
          <option>その他</option>
        </select>
      </div>

      <div class="form-field">
        <label>お問い合わせ内容</label>
        <textarea name="お問い合わせ内容"></textarea>
      </div>

      <div class="form-field">
        <label class="form-check">
          <input type="checkbox" required style="margin-top:3px;">
          <span><a href="privacy.html" style="text-decoration:underline;">個人情報の取り扱い</a>に同意する</span>
        </label>
      </div>

      <button type="submit" class="form-submit">送信する</button>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div>今井雄馬</div>
    <div>鹿児島県内 採用代行(RPO)・人材紹介サービス</div>
  </div>
</footer>

</body>
</html>
