<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="デスクでノートパソコンに向かう人物と、窓越しに見える桜島のイラスト">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECE8E0"/>
      <stop offset="100%" stop-color="#E2DDD1"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#heroSky)"/>

  <!-- floor line -->
  <line x1="40" y1="420" x2="440" y2="420" stroke="#C7BFAE" stroke-width="2"/>

  <!-- window with sakurajima view -->
  <rect x="300" y="48" width="140" height="104" rx="8" fill="#F5F2EA" stroke="#20241F" stroke-width="2.5"/>
  <path d="M300 140 L 340 108 L 358 118 L 380 92 L 440 130 L 440 152 L 300 152 Z" fill="#20241F" clip-path="inset(0 0 0 0)"/>
  <circle cx="356" cy="104" r="3" fill="#DD7A2C"/>
  <rect x="300" y="140" width="140" height="12" fill="#2E5C5E"/>
  <line x1="370" y1="48" x2="370" y2="152" stroke="#20241F" stroke-width="2"/>
  <line x1="300" y1="100" x2="440" y2="100" stroke="#20241F" stroke-width="2"/>

  <!-- plant -->
  <path d="M70 392 C 60 370 60 350 70 335 C 80 350 80 370 70 392 Z" fill="#2E5C5E"/>
  <path d="M70 392 C 82 372 92 358 108 350 C 100 368 88 382 70 392 Z" fill="#2E5C5E" opacity="0.85"/>
  <path d="M70 392 C 58 374 48 360 34 352 C 42 370 54 384 70 392 Z" fill="#2E5C5E" opacity="0.85"/>
  <path d="M56 392 h28 l-4 28 h-20 Z" fill="#B85E1C"/>

  <!-- desk -->
  <rect x="96" y="330" width="300" height="16" rx="3" fill="#20241F"/>
  <rect x="110" y="346" width="10" height="60" fill="#20241F"/>
  <rect x="372" y="346" width="10" height="60" fill="#20241F"/>

  <!-- chair back -->
  <path d="M140 330 C 134 300 134 272 150 252" stroke="#20241F" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- person: faceless silhouette, deliberately abstract -->
  <circle cx="168" cy="246" r="24" fill="#20241F"/>
  <path d="M136 330 C 132 292 144 262 176 258 C 206 262 214 292 212 330 Z" fill="#20241F"/>
  <path d="M190 300 C 208 296 222 288 232 278" stroke="#20241F" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- laptop -->
  <rect x="214" y="256" width="92" height="66" rx="6" fill="#2E5C5E"/>
  <rect x="224" y="266" width="72" height="8" rx="2" fill="#ECE8E0" opacity="0.9"/>
  <rect x="224" y="280" width="56" height="8" rx="2" fill="#ECE8E0" opacity="0.7"/>
  <rect x="224" y="294" width="64" height="8" rx="2" fill="#ECE8E0" opacity="0.5"/>
  <path d="M206 330 L 314 330 L 300 338 L 220 338 Z" fill="#20241F"/>

  <!-- floating notification card -->
  <rect x="280" y="196" width="116" height="50" rx="12" fill="#DD7A2C"/>
  <path d="m302 220 7 7 15-15" stroke="#ECE8E0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="334" y="225" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#ECE8E0" font-weight="700">応募</text>
  <text x="334" y="240" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#ECE8E0" font-weight="700">あり</text>
</svg>
